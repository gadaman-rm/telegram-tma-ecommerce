<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>TMA Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="toolbar">
      <h1 id="page-title">Product Descriptions</h1>
      <label class="language-picker" for="language-select">
        <select id="language-select" aria-label="Select language">
          <option value="en">English</option>
          <option value="es">Español</option>
          <option value="fa">فارسی</option>
          <option value="zh">中文</option>
        </select>
      </label>
    </div>

    <div id="catalog" class="catalog"></div>

    <div id="gallery-modal" class="gallery-modal" hidden>
      <div class="gallery-dialog" role="dialog" aria-modal="true" aria-labelledby="gallery-counter" tabindex="-1">
        <button id="gallery-close" class="gallery-control gallery-close" type="button" aria-label="Close gallery">&times;</button>
        <button id="gallery-previous" class="gallery-control gallery-previous" type="button" aria-label="Previous image">&#8249;</button>
        <img id="gallery-image" class="gallery-image" alt="" />
        <button id="gallery-next" class="gallery-control gallery-next" type="button" aria-label="Next image">&#8250;</button>
        <div id="gallery-counter" class="gallery-counter"></div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
