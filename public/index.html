<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>TMA Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="toolbar">
      <h1 id="page-title">Product Descriptions</h1>
      <label class="language-picker" for="language-select">
        <select id="language-select" aria-label="Select language">
          <option value="en">English</option>
          <option value="es">Español</option>
          <option value="fa">فارسی</option>
          <option value="zh">中文</option>
        </select>
      </label>
    </div>

    <div id="catalog" class="catalog"></div>

    <div class="shop-footer" aria-label="Seller contact footer">
      <div class="footer-inner">
        <div class="footer-message">Ask your quest or buy</div>

        <div class="footer-links">
          <a
            id="seller-whatsapp"
            class="contact-button whatsapp"
            href="https://wa.me/15551234567?text=Hello%20I%20want%20to%20ask%20about%20your%20products"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Contact via WhatsApp"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" class="contact-icon">
              <path d="M20.5 3.5A11.2 11.2 0 0 0 12.1 1C6.5 1 2 5.6 2 11.2c0 1.9.5 3.8 1.5 5.4L2 23l6.7-1.7c1.5.8 3.2 1.2 5 1.2h.1c5.6 0 10.1-4.6 10.1-10.2 0-2.7-1.1-5.3-3-7.2Zm-8.4 15.5c-1.5 0-3-.4-4.3-1.1l-.3-.2-4 1 1.1-3.9-.2-.4A8.2 8.2 0 0 1 3.8 11c0-4.6 3.7-8.3 8.3-8.3 2.2 0 4.2.8 5.7 2.4a8.1 8.1 0 0 1 2.3 5.9c0 4.6-3.8 8.3-8.3 8.3Zm4.6-6.2c-.2-.1-1.2-.6-1.4-.7-.2-.1-.4-.1-.5.1-.2.2-.6.7-.8.8-.1.2-.3.2-.6.1a6.5 6.5 0 0 1-2-1.2 7.2 7.2 0 0 1-1.3-1.6c-.1-.2 0-.3.1-.4.1-.2.2-.3.3-.4.1-.1.2-.2.3-.4.1-.1 0-.3 0-.4.1-.1.3-.7.4-.9.1-.2.1-.4 0-.5-.1-.1-.5-1.2-.7-1.7-.2-.4-.4-.3-.5-.3h-.4c-.2 0-.4.1-.5.3-.2.2-.7.7-.7 1.7s.7 1.9.8 2.1c.1.2 1.4 2.3 3.4 3.1.5.2.9.3 1.2.4.5.2.9.2 1.2.1.4-.1 1.2-.5 1.4-.9.2-.4.2-.7.2-.8 0-.2-.2-.2-.4-.3Z"/>
            </svg>
            <span>WhatsApp</span>
          </a>

          <a
            id="seller-telegram"
            class="contact-button telegram"
            href="https://t.me/your_seller_username"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Contact via Telegram"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true" class="contact-icon">
              <path d="M21.9 5.2c.2-.7-.5-1.3-1.2-1L3.2 11.5a1 1 0 0 0-.1 1.8l4 1.8 1.8 5.8A1.1 1.1 0 0 0 10.7 21l2.1-3.1 4.5 3.4c.8.6 1.9.1 2.1-.8l2.8-13.5Zm-4.8 4.2-7.1 4.6c-.4.2-.7.1-.8-.3l-.4-1.3c-.1-.4.1-.7.5-.9l8.2-4.5c.3-.2.7 0 .6.5-.1.2-.2.4-.5.7Z"/>
            </svg>
            <span>Telegram</span>
          </a>
        </div>

        <div class="footer-address">Address: Tehran, Iran</div>
      </div>
    </div>

    <div id="gallery-modal" class="gallery-modal" hidden>
      <div class="gallery-dialog" role="dialog" aria-modal="true" aria-labelledby="gallery-counter" tabindex="-1">
        <button id="gallery-close" class="gallery-control gallery-close" type="button" aria-label="Close gallery">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
        </button>
        <div class="gallery-stage">
          <img id="gallery-image" class="gallery-image" alt="" />
          <div id="gallery-counter" class="gallery-counter"></div>
          <div class="gallery-caption">
            <button id="gallery-previous" class="gallery-control gallery-previous" type="button" aria-label="Previous image">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 5-7 7 7 7" /></svg>
            </button>
            <div id="gallery-description" class="gallery-description"></div>
            <button id="gallery-next" class="gallery-control gallery-next" type="button" aria-label="Next image">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 5 7 7-7 7" /></svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
